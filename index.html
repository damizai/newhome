<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home"><i class="fas fa-home"></i> 首页</a></li>
                <li><a href="#about"><i class="fas fa-user"></i> 关于我</a></li>
                <li><a href="#projects"><i class="fas fa-code"></i> 项目</a></li>
                <li><a href="#contact"><i class="fas fa-envelope"></i> 联系方式</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <h1>欢迎来到我的个人主页</h1>
            <p>这里是我展示个人作品和分享想法的地方</p>
            <div class="social-links">
                <a href="#" target="_blank"><i class="fab fa-github"></i></a>
                <a href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
            </div>
        </section>

        <section id="about">
            <h2>关于我</h2>
            <div class="about-content">
                <div class="about-text">
                    <p>在这里添加你的个人介绍</p>
                    <p>你可以描述你的技能、经验和兴趣爱好</p>
                </div>
                <div class="skills">
                    <h3>技能专长</h3>
                    <div class="skill-tags">
                        <span>HTML5</span>
                        <span>CSS3</span>
                        <span>JavaScript</span>
                        <span>React</span>
                        <span>Node.js</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="projects">
            <h2>我的项目</h2>
            <div class="project-grid">
                <div class="project-card">
                    <h3>项目名称 1</h3>
                    <p>项目描述和主要功能说明</p>
                    <div class="project-links">
                        <a href="#" target="_blank"><i class="fab fa-github"></i> 查看代码</a>
                        <a href="#" target="_blank"><i class="fas fa-external-link-alt"></i> 访问网站</a>
                    </div>
                </div>
                <div class="project-card">
                    <h3>项目名称 2</h3>
                    <p>项目描述和主要功能说明</p>
                    <div class="project-links">
                        <a href="#" target="_blank"><i class="fab fa-github"></i> 查看代码</a>
                        <a href="#" target="_blank"><i class="fas fa-external-link-alt"></i> 访问网站</a>
                    </div>
                </div>
            </div>
        </section>

        <section id="contact">
            <h2>联系我</h2>
            <div class="contact-content">
                <div class="contact-info">
                    <p><i class="fas fa-envelope"></i> email@example.com</p>
                    <p><i class="fas fa-phone"></i> +86 123 4567 8900</p>
                    <p><i class="fas fa-map-marker-alt"></i> 城市，省份</p>
                </div>
                <form class="contact-form">
                    <input type="text" placeholder="你的姓名" required>
                    <input type="email" placeholder="你的邮箱" required>
                    <textarea placeholder="你的留言" required></textarea>
                    <button type="submit">发送消息</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 我的个人主页. All rights reserved.</p>
    </footer>

    <script src="static/js/main.js"></script>
</body>
</html>
